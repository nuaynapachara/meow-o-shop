<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meow O Shop</title>
    <style>
        body {
            font-family: 'Sukhumvit Set', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
            color: #333;
        }
        header {
            text-align: center;
            padding: 20px 0;
            background-color: #ff8c00;
            color: white;
            border-radius: 12px;
            margin-bottom: 25px;
        }
        h1 { margin: 0; font-size: 24px; }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
        }
        .product-card {
            background: white;
            border-radius: 10px;
            padding: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
        }
        .product-card h3 {
            font-size: 16px;
            margin: 10px 0 5px;
        }
        .price {
            color: #e65100;
            font-weight: bold;
            margin-bottom: 10px;
        }
        button {
            background-color: #ff8c00;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
        }
        button:active {
            background-color: #e65100;
        }
    </style>
</head>
<body><div id="product-container"></div>
    <header>
        <h1>🐱 Meow O Shop 🐾</h1>
        <p>ร้านค้าอุปกรณ์และอาหารแมวออนไลน์</p>
    </header>

    <div class="product-grid" id="product-container">
        <!-- โค้ดสินค้าจาก products.json และ script.js จะมาแสดงตรงนี้ -->
    </div>

    <script src="script.js"></script>
</body>
</html>
